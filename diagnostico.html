<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico Rafaellen 27</title><style>body{font:16px system-ui;background:#fff1f7;color:#45172f;max-width:470px;margin:auto;padding:25px}main{background:white;border-radius:20px;padding:22px}button{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#f65ca0;color:white;font-weight:bold;margin:14px 0}pre{white-space:pre-wrap;font-family:inherit;background:#fff0f6;padding:15px;border-radius:10px}</style><main><h2>💗 Testar conexão</h2><p>Este diagnóstico não modifica seu convite. Ele testa a conexão com sua planilha privada.</p><button id="a">1. Verificar Google</button><button id="b">2. Enviar TESTE GITHUB</button><pre id="log">Aguardando...</pre></main><script>
const url='https://script.google.com/macros/s/AKfycbzqgYhhd4fZnb4P5EivA5YW1vpN66lZaqcpNeNpuUzJvXT1viXyVzYGiZC4uYwJdMKx/exec', log=document.querySelector('#log'), say=s=>log.textContent=s;
const id=()=> 'rf-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
function check(x){return new Promise((resolve,reject)=>{let cb='rafa_check_'+Math.random().toString(36).slice(2),s=document.createElement('script'),t=setTimeout(()=>{clear();reject(Error('Google não respondeu em 12 segundos'))},12000);function clear(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=v=>{clear();resolve(v)};s.onerror=()=>{clear();reject(Error('Consulta Google bloqueada'))};s.src=url+'?acao=verificar&id='+encodeURIComponent(x)+'&callback='+cb+'&t='+Date.now();document.head.append(s)})}
document.querySelector('#a').onclick=async()=>{say('Consultando Google...');try{say('✅ Conexão de leitura: '+JSON.stringify(await check(id())))}catch(e){say('❌ '+e.message)}};
document.querySelector('#b').onclick=async()=>{let x=id();say('Enviando...');try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({id:x,nome:'TESTE GITHUB',presenca:'Confirmada',acompanhantes:0,jogo:'Uno',recado:'Teste de conexão'})});let ok=false;for(let i=0;i<5;i++){await new Promise(r=>setTimeout(r,1700));if((await check(x)).registrado){ok=true;break}}say(ok?'✅ TESTE GITHUB gravado na planilha.':'⚠️ Envio solicitado, mas registro não encontrado na planilha.')}catch(e){say('❌ '+e.message)}};</script></html>
